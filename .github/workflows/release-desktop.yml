name: Release desktop

# Builds the EcoLinga desktop installers and attaches them to a draft GitHub
# Release, which is published by hand after checking it.
#
# To release: bump "version" in frontend/src-tauri/tauri.conf.json, merge it,
# then push a matching tag (git tag v0.2.0 && git push origin v0.2.0).
# "Run workflow" from the Actions tab builds the current version without a tag.
#
# The API URL is baked in at build time from frontend/.env.production.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than latest: the AppImage and .deb then run on
          # older distributions too, since they link against this glibc.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # One universal .dmg that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS build compiles for both CPU architectures.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # __VERSION__ is replaced by the version in tauri.conf.json.
          tagName: v__VERSION__
          releaseName: 'EcoLinga v__VERSION__'
          releaseBody: 'Windows: .msi or -setup.exe. macOS: .dmg (Apple Silicon and Intel). Linux: .deb (Ubuntu/Debian), .rpm (Fedora) or .AppImage (any distribution).'
          releaseDraft: true
          prerelease: false
